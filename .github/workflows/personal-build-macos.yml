name: Personal Build macOS

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to bundle
        required: true
        default: oss
        type: choice
        options:
          - oss
          - dev
          - local
      debug_build:
        description: Build a debug bundle for faster iteration
        required: true
        default: false
        type: boolean
      signing_mode:
        description: Bundle signing mode
        required: true
        default: selfsign
        type: choice
        options:
          - selfsign
          - nosign

permissions:
  contents: read

concurrency:
  group: personal-build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: true

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build personal macOS bundle
        id: bundle
        shell: bash
        run: |
          args=(--channel "${{ inputs.channel }}" --nouniversal)
          if [[ "${{ inputs.debug_build }}" == "true" ]]; then
            args+=(--debug)
          fi
          if [[ "${{ inputs.signing_mode }}" == "selfsign" ]]; then
            args+=(--selfsign)
          else
            args+=(--nosign)
          fi
          script/bundle "${args[@]}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: personal-macos-dmg-${{ inputs.channel }}-${{ github.ref_name }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          retention-days: 14
