name: Personal Sync Upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to mirror into the fork tracking branch
        required: false
        default: master
        type: string
      target_branch:
        description: Fork branch to overwrite with upstream
        required: false
        default: upstream-master
        type: string

permissions:
  contents: write

concurrency:
  group: personal-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: warpdotdev/warp
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'upstream-master' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Mirror upstream into fork tracking branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}" --force
